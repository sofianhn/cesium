<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>Cesium OffscreenCanvas Worker Demo</title>
    <script>
      window.CESIUM_BASE_URL = new URL(
        "../Build/Cesium/",
        window.location.href,
      ).href;
    </script>
    <script src="../Build/Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="../Build/Cesium/Widgets/widgets.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #cesiumContainer {
        position: absolute;
        inset: 0;
      }
      #statusBar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-size: 13px;
        box-sizing: border-box;
        pointer-events: none;
      }
      #statusText {
        flex: 1;
        line-height: 1.3;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: #48b;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        pointer-events: auto;
      }
      button:disabled {
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="statusBar">
      <div id="statusText">Starting worker globe…</div>
      <button id="pickButton" disabled>Pick center</button>
    </div>
    <script>
      const statusText = document.getElementById("statusText");
      const pickButton = document.getElementById("pickButton");

      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      async function updatePixelStatus(widget) {
        const canvas = widget.canvas;
        const width = Math.max(
          1,
          Math.floor(canvas.clientWidth / 2) ||
            Math.floor(window.innerWidth / 2),
        );
        const height = Math.max(
          1,
          Math.floor(canvas.clientHeight / 2) ||
            Math.floor(window.innerHeight / 2),
        );
        const pixel = await widget.samplePixel(width, height);
        if (widget._lastWorkerError) {
          statusText.textContent = `Worker error: ${widget._lastWorkerError}`;
          return;
        }
        if (Array.isArray(pixel)) {
          const sum = pixel[0] + pixel[1] + pixel[2];
          statusText.textContent =
            sum > 10
              ? `Rendering · center rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]}) · drag/pinch to move`
              : `Worker running but frame is black rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
        } else {
          statusText.textContent = "Worker running · could not sample pixel";
        }
      }

      const supportsOffscreen =
        typeof HTMLCanvasElement !== "undefined" &&
        typeof HTMLCanvasElement.prototype.transferControlToOffscreen ===
          "function";

      if (!supportsOffscreen) {
        statusText.textContent =
          "This browser does not support transferControlToOffscreen.";
      } else {
        let widget;
        try {
          widget = new window.Cesium.OffscreenCesiumWidget("cesiumContainer", {
            useWorldImagery: true,
            useOpenStreetMapImagery: false,
            simpleGlobe: isIOS,
            useWorldTerrain: false,
            enableInputs: true,
            pixelRatio: isIOS ? 1 : Math.min(window.devicePixelRatio || 1, 2),
            backgroundColor: [25, 45, 85, 255],
            contextOptions: {
              webgl: {
                alpha: false,
                antialias: false,
                preserveDrawingBuffer: true,
                powerPreference: "high-performance",
              },
            },
          });
        } catch (error) {
          statusText.textContent = `Widget failed: ${error.message || error}`;
          widget = undefined;
        }

        if (widget) {
          widget.readyPromise
            .then(function () {
              const resizeNow = function () {
                widget.resize();
              };
              resizeNow();
              requestAnimationFrame(resizeNow);
              setTimeout(resizeNow, 250);
              setTimeout(resizeNow, 1000);

              statusText.textContent =
                "Loading globe · drag to orbit · pinch to zoom";
              pickButton.disabled = false;

              setTimeout(function () {
                updatePixelStatus(widget);
              }, 2000);
              setTimeout(function () {
                updatePixelStatus(widget);
              }, 6000);
            })
            .catch(function (error) {
              statusText.textContent = `Worker init failed: ${error.message || error}`;
            });

          pickButton.addEventListener("click", async function () {
            const canvas = widget.canvas;
            const picked = await widget.pick(
              canvas.clientWidth / 2,
              canvas.clientHeight / 2,
            );
            statusText.textContent = picked
              ? `Picked object id: ${picked.id}`
              : "Nothing picked at center";
          });

          window.addEventListener("resize", function () {
            widget.resize();
          });
        }

        window.addEventListener("error", function (event) {
          if (event.message && statusText.textContent.startsWith("Starting")) {
            statusText.textContent = `Error: ${event.message}`;
          }
        });
      }
    </script>
  </body>
</html>
