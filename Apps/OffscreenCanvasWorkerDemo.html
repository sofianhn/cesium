<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>Cesium OffscreenCanvas Worker Demo</title>
    <script>
      window.CESIUM_BASE_URL = "../Build/Cesium/";
    </script>
    <script src="../Build/Cesium/Cesium.js"></script>
    <style>
      @import url(../Build/Cesium/Widgets/widgets.css);
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #cesiumContainer {
        position: absolute;
        inset: 0;
      }
      #statusBar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-size: 14px;
        box-sizing: border-box;
        pointer-events: none;
      }
      #statusText {
        flex: 1;
        line-height: 1.3;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: #48b;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        pointer-events: auto;
      }
      button:disabled {
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <div id="statusBar">
      <div id="statusText">Starting worker globe…</div>
      <button id="pickButton" disabled>Pick center</button>
    </div>
    <div id="cesiumContainer"></div>
    <script>
      const statusText = document.getElementById("statusText");
      const pickButton = document.getElementById("pickButton");

      const supportsOffscreen =
        typeof HTMLCanvasElement !== "undefined" &&
        typeof HTMLCanvasElement.prototype.transferControlToOffscreen ===
          "function";

      if (!supportsOffscreen) {
        statusText.textContent =
          "This browser does not support transferControlToOffscreen.";
      } else {
        const widget = new window.Cesium.OffscreenCesiumWidget(
          "cesiumContainer",
          {
            useWorldImagery: true,
            useWorldTerrain: false,
            enableInputs: true,
          },
        );

        widget.readyPromise
          .then(function () {
            widget.resize();
            statusText.textContent =
              "Drag to orbit · pinch to zoom · worker OffscreenCanvas";
            pickButton.disabled = false;
          })
          .catch(function (error) {
            statusText.textContent = `Worker init failed: ${error.message || error}`;
          });

        pickButton.addEventListener("click", async function () {
          const canvas = widget.canvas;
          const picked = await widget.pick(
            canvas.clientWidth / 2,
            canvas.clientHeight / 2,
          );
          const message = picked
            ? `Picked object id: ${picked.id}`
            : "Nothing picked at center";
          statusText.textContent = message;
        });

        window.addEventListener("resize", function () {
          widget.resize();
        });
      }
    </script>
  </body>
</html>
