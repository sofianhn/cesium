<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>Cesium OffscreenCanvas Worker Demo</title>
    <script>
      window.CESIUM_BASE_URL = "../Build/Cesium/";
    </script>
    <script src="../Build/Cesium/Cesium.js"></script>
    <style>
      @import url(../Build/Cesium/Widgets/widgets.css);
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #cesiumContainer {
        position: absolute;
        inset: 0;
      }
      #statusBar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-size: 13px;
        box-sizing: border-box;
        pointer-events: none;
      }
      #statusText {
        flex: 1;
        line-height: 1.3;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: #48b;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        pointer-events: auto;
      }
      button:disabled {
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="statusBar">
      <div id="statusText">Starting worker globe…</div>
      <button id="pickButton" disabled>Pick center</button>
    </div>
    <script>
      const statusText = document.getElementById("statusText");
      const pickButton = document.getElementById("pickButton");

      async function updatePixelStatus(widget) {
        const canvas = widget.canvas;
        const pixel = await widget.samplePixel(
          Math.floor(canvas.clientWidth / 2),
          Math.floor(canvas.clientHeight / 2),
        );
        if (Array.isArray(pixel)) {
          const sum = pixel[0] + pixel[1] + pixel[2];
          statusText.textContent =
            sum > 10
              ? `Rendering · center rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]}) · drag/pinch to move`
              : `Worker running but frame is black rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
        } else {
          statusText.textContent = "Worker running · could not sample pixel";
        }
      }

      const supportsOffscreen =
        typeof HTMLCanvasElement !== "undefined" &&
        typeof HTMLCanvasElement.prototype.transferControlToOffscreen ===
          "function";

      if (!supportsOffscreen) {
        statusText.textContent =
          "This browser does not support transferControlToOffscreen.";
      } else {
        const widget = new window.Cesium.OffscreenCesiumWidget(
          "cesiumContainer",
          {
            useWorldImagery: false,
            useOpenStreetMapImagery: true,
            useWorldTerrain: false,
            enableInputs: true,
            pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
            contextOptions: {
              webgl: {
                preserveDrawingBuffer: true,
                powerPreference: "high-performance",
              },
            },
          },
        );

        widget.readyPromise
          .then(async function () {
            requestAnimationFrame(function () {
              widget.resize();
            });
            statusText.textContent =
              "Loading map tiles · drag to orbit · pinch to zoom";
            pickButton.disabled = false;

            setTimeout(function () {
              updatePixelStatus(widget);
            }, 2000);
            setTimeout(function () {
              updatePixelStatus(widget);
            }, 5000);
          })
          .catch(function (error) {
            statusText.textContent = `Worker init failed: ${error.message || error}`;
          });

        pickButton.addEventListener("click", async function () {
          const canvas = widget.canvas;
          const picked = await widget.pick(
            canvas.clientWidth / 2,
            canvas.clientHeight / 2,
          );
          statusText.textContent = picked
            ? `Picked object id: ${picked.id}`
            : "Nothing picked at center";
        });

        window.addEventListener("resize", function () {
          widget.resize();
        });
      }
    </script>
  </body>
</html>
